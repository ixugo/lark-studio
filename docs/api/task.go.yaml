openapi: 3.1.0
info:
  title: vdub Task API
  version: 1.0.0
paths:
  /tasks:
    post:
      tags:
        - admin/任务管理
      summary: 创建确定参数的处理任务
      description: 创建时展开当前配置并写入 SQLite，任务恢复时继续使用同一组参数。输入副本与中间文件位于 UUIDv4 工作子目录；自动创建的单源成片 output.mp4 与该子目录同级。重复提交会创建独立目录。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskInput'
      responses:
        '200':
          description: 任务创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: 文件、模式或配方参数无效
  /tasks/batch:
    post:
      tags:
        - admin/任务管理
      summary: 批量创建处理任务
      description: 多于一个输入时，在默认输出根目录建立同一批次目录，每个输入使用独立 UUIDv4 工作子目录和同名 UUIDv4.mp4 成片。单输入使用单源布局。保留原文件名用于任务标题，不覆盖同名素材。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/BatchTaskInput'
      responses:
        '200':
          description: 已创建的任务列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Task'
                  total:
                    type: integer
  /tasks/{id}:
    delete:
      tags:
        - admin/任务管理
      summary: 删除任务及其生成文件
      description: 停止排队或运行中的任务，等待处理结束后删除字幕、配音、成片、中间文件和工作副本，再删除任务记录。原始素材和无关文件保留。产物清理失败或输出目录被其他任务共用时返回错误并保留记录。重复删除已不存在的任务仍返回成功。
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: 任务 ID
      responses:
        '200':
          description: 任务记录和产物已删除
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '500':
          description: 任务产物无法安全清理，记录保留供重试
  /tasks/{id}/logs:
    get:
      tags:
        - admin/任务管理
      summary: 获取任务日志
      description: 返回 SQLite 中该任务最近 1000 行日志，用于重新进入任务详情后恢复历史日志。
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: 任务 ID
      responses:
        '200':
          description: 日志读取成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    description: 按写入时间正序排列的结构化日志
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          format: int64
                        task_id:
                          type: string
                        level:
                          type: string
                        step:
                          type: string
                        message:
                          type: string
                        created_at:
                          type: string
                          format: date-time
        '404':
          description: 任务不存在
components:
  schemas:
    CreateTaskInput:
      type: object
      required:
        - input_path
        - mode
      properties:
        input_path:
          type: string
        output_dir:
          type: string
          description: 请求时可指定成片父目录，响应中为该输入的 UUIDv4 工作目录；成片父目录另见 batch_dir。
        mode:
          type: integer
          minimum: 1
          maximum: 3
        source_lang:
          type: string
          default: auto
        target_lang:
          type: string
          default: zh-CN
        translator:
          type: string
          enum: [bing, deeplx, openai]
          default: bing
        output_content:
          type: string
          enum: [source, translated, bilingual]
          default: bilingual
        tts_engine:
          type: string
          enum: [edge, openai]
          default: edge
        tts_voice:
          type: string
        speech_rate:
          type: number
          minimum: 0.5
          maximum: 2
          default: 1
        subtitle_output:
          type: string
          enum: [burn, file, none]
          default: burn
        recipe_name:
          type: string
          maxLength: 64
    BatchTaskInput:
      type: object
      required: [videos, mode]
      properties:
        videos:
          type: array
          items:
            type: string
        mode:
          type: integer
          minimum: 1
          maximum: 6
        target_lang:
          type: string
        source_lang:
          type: string
        translator:
          type: string
          enum: [bing, google, openai, local]
        output_content:
          type: string
        tts_engine:
          type: string
        tts_voice:
          type: string
        speech_rate:
          type: number
        subtitle_output:
          type: string
        recipe_name:
          type: string
    Task:
      allOf:
        - $ref: '#/components/schemas/CreateTaskInput'
        - type: object
          properties:
            original_name:
              type: string
              description: 上传原始文件名；从源文件记录读取，旧任务兼容。
            batch_dir:
              type: string
              description: 成片目录；多输入任务共享一个批次目录，每个输入有独立 UUIDv4 工作子目录。
            result_path:
              type: string
              description: 成片路径；单源自动目录使用 output.mp4，批次使用 UUIDv4.mp4，与工作子目录同级。
            id:
              type: string
            status:
              type: integer
            current_step:
              type: string
            progress:
              type: integer
            step_progress:
              type: integer
            current_detail:
              type: string
            error:
              type: string
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
