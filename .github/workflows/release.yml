name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

env:
  NODE_VERSION: '20'

# 暂停 Linux 发布构建，仅生成 macOS 和 Windows 安装包。
jobs:
  build-desktop:
    name: Build ${{ matrix.platform }} package
    # 两个 Make 目标都使用 Bash 和 Unix 工具；Windows 在 macOS 上交叉编译。
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            target: bundle/macos/arm64
            goos: darwin
            goarch: arm64
            asset: macos_arm64.dmg
          - platform: windows-amd64
            target: bundle/windows
            goos: windows
            goarch: amd64
            asset: windows_amd64.zip
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      # vendor 存放 FFmpeg 等运行时文件，不是 Go 依赖目录。
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install packaging dependencies
        run: |
          if ! command -v trash >/dev/null; then
            brew install trash
          fi

      - name: Build release package
        run: make "${{ matrix.target }}" VERSION="$RELEASE_TAG" GOOS="${{ matrix.goos }}" GOARCH="${{ matrix.goarch }}" BINARY=lark-studio

      - name: Verify release package
        run: test -s "build/dist/lark-studio_${RELEASE_TAG}_${{ matrix.asset }}"

      - name: Upload package to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          fail_on_unmatched_files: true
          files: build/dist/lark-studio_${{ github.event.release.tag_name }}_${{ matrix.asset }}
