name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

env:
  GO_VERSION: '1.27'
  NODE_VERSION: '20'
  FFMPEG_LINUX_AMD64_URL: 'https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffmpeg-linux-x64.gz'
  FFMPEG_LINUX_ARM64_URL: 'https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffmpeg-linux-arm64.gz'

jobs:
  build-desktop:
    name: Build ${{ matrix.platform }} package
    # 两个 Make 目标都使用 Bash 和 Unix 工具；Windows 在 macOS 上交叉编译。
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            target: bundle/macos/arm64
            goos: darwin
            goarch: arm64
            asset: macos_arm64.dmg
          - platform: windows-amd64
            target: bundle/windows
            goos: windows
            goarch: amd64
            asset: windows_amd64.zip
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      # vendor 存放 FFmpeg 等运行时文件，不是 Go 依赖目录。
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install packaging dependencies
        run: |
          if ! command -v trash >/dev/null; then
            brew install trash
          fi

      - name: Build release package
        run: make "${{ matrix.target }}" VERSION="$RELEASE_TAG" GOOS="${{ matrix.goos }}" GOARCH="${{ matrix.goarch }}"

      - name: Upload package to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          fail_on_unmatched_files: true
          files: build/dist/lark-studio_${{ github.event.release.tag_name }}_${{ matrix.asset }}

  build-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goarch: amd64
            ffmpeg_url_env: FFMPEG_LINUX_AMD64_URL
            cc: gcc
            cxx: g++
            cross_pkgs: ''
          - goarch: arm64
            ffmpeg_url_env: FFMPEG_LINUX_ARM64_URL
            cc: aarch64-linux-gnu-gcc
            cxx: aarch64-linux-gnu-g++
            cross_pkgs: gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build Frontend (Linux)
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            ${{ matrix.cross_pkgs }}

      - name: Download ffmpeg (Linux ${{ matrix.goarch }})
        run: |
          mkdir -p vendor/ffmpeg/linux
          curl -fSL "${{ env[matrix.ffmpeg_url_env] }}" | gunzip > vendor/ffmpeg/linux/ffmpeg
          chmod +x vendor/ffmpeg/linux/ffmpeg

      - name: Build whisper.cpp runtime (Linux ${{ matrix.goarch }})
        run: |
          chmod +x scripts/build-whisper-runtime.sh
          scripts/build-whisper-runtime.sh linux ${{ matrix.goarch }}

      - name: Build Go desktop single binary (Linux ${{ matrix.goarch }})
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
          BRANCH=$(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo "unknown")
          HASH=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")
          TIME=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          go build -trimpath -ldflags "-X main.buildVersion=$VERSION -X main.gitBranch=$BRANCH -X main.gitHash=$HASH -X main.buildTime=$TIME -X main.release=true -s -w" -o build/linux_${{ matrix.goarch }}/vdub .

      - name: Compress Go binary with UPX
        if: matrix.goarch == 'amd64'
        run: |
          sudo apt-get install -y upx-ucl || true
          upx --best --lzma build/linux_${{ matrix.goarch }}/vdub || true

      - name: Assemble release package
        run: |
          RELEASE_DIR="build/linux_${{ matrix.goarch }}_release"
          mkdir -p "$RELEASE_DIR"
          cp build/linux_${{ matrix.goarch }}/vdub "$RELEASE_DIR/vdub"
          cp vendor/ffmpeg/linux/ffmpeg "$RELEASE_DIR/ffmpeg"
          cp -R vendor/whisper/linux "$RELEASE_DIR/whisper"
          TAG="${{ github.event.release.tag_name }}"
          tar -czf "vdub-linux-${{ matrix.goarch }}-$TAG.tar.gz" -C "$RELEASE_DIR" .
          tar -czf "vdub-whisper-linux-${{ matrix.goarch }}.tar.gz" -C vendor/whisper/linux .

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            vdub-linux-${{ matrix.goarch }}-*.tar.gz
            vdub-whisper-linux-${{ matrix.goarch }}.tar.gz
