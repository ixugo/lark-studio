name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

env:
  GO_VERSION: '1.27'
  FLUTTER_VERSION: '3.44.4'
  FFMPEG_WIN_URL: 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip'
  FFMPEG_MACOS_ARM64_URL: 'https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffmpeg-darwin-arm64.gz'
  FFMPEG_MACOS_X64_URL: 'https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffmpeg-darwin-x64.gz'
  FFMPEG_LINUX_AMD64_URL: 'https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffmpeg-linux-x64.gz'
  FFMPEG_LINUX_ARM64_URL: 'https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffmpeg-linux-arm64.gz'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Download ffmpeg (Windows)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path vendor/ffmpeg/windows
          $zipPath = "$env:TEMP\ffmpeg_win.zip"
          Invoke-WebRequest -Uri $env:FFMPEG_WIN_URL -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath $env:TEMP\ffmpeg_extract -Force
          $binDir = Get-ChildItem -Path $env:TEMP\ffmpeg_extract -Recurse -Directory -Filter "bin" | Select-Object -First 1
          Copy-Item "$($binDir.FullName)\ffmpeg.exe" "vendor\ffmpeg\windows\ffmpeg.exe"

      - name: Build whisper.cpp runtime (Windows amd64)
        shell: pwsh
        run: ./scripts/build-whisper-runtime.ps1 -TargetOS windows -TargetArch amd64

      - name: Build Go engine (Windows amd64)
        shell: pwsh
        env:
          GOOS: windows
          GOARCH: amd64
        run: |
          $version = git describe --tags --always --dirty 2>$null
          if (-not $version) { $version = "dev" }
          $branch = git rev-parse --abbrev-ref HEAD 2>$null
          $hash = git rev-parse --short HEAD 2>$null
          $time = (Get-Date -Format "yyyy-MM-ddTHH:mm:ssZ")
          $ldflags = "-X main.buildVersion=$version -X main.gitBranch=$branch -X main.gitHash=$hash -X main.buildTime=$time -X main.release=true -s -w"
          go build -trimpath -ldflags $ldflags -o build\windows_amd64\vdub.exe .

      - name: Build Flutter UI (Windows)
        working-directory: ui
        run: |
          flutter pub get
          flutter build windows --release --split-debug-info=../build/debug-info --obfuscate

      - name: Compress binaries with UPX
        shell: pwsh
        run: |
          choco install upx -y --no-progress
          upx --best --lzma build\windows_amd64\vdub.exe
          upx --best --lzma vendor\ffmpeg\windows\ffmpeg.exe

      - name: Assemble release package
        shell: pwsh
        run: |
          $releaseDir = "ui\build\windows\x64\runner\Release"
          Copy-Item "build\windows_amd64\vdub.exe" "$releaseDir\vdub.exe"
          Copy-Item "vendor\ffmpeg\windows\ffmpeg.exe" "$releaseDir\ffmpeg.exe"
          Copy-Item "vendor\whisper\windows" "$releaseDir\whisper" -Recurse -Force
          $tag = "${{ github.event.release.tag_name }}"
          Compress-Archive -Path "$releaseDir\*" -DestinationPath "vdub-windows-amd64-$tag.zip"
          tar -czf "vdub-whisper-windows-amd64.tar.gz" -C "vendor\whisper\windows" .

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            vdub-windows-amd64-*.zip
            vdub-whisper-windows-amd64.tar.gz

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Download ffmpeg (macOS arm64)
        run: |
          mkdir -p vendor/ffmpeg/darwin
          curl -fSL "$FFMPEG_MACOS_ARM64_URL" | gunzip > vendor/ffmpeg/darwin/ffmpeg
          chmod +x vendor/ffmpeg/darwin/ffmpeg

      - name: Build whisper.cpp runtime (macOS arm64)
        run: |
          chmod +x scripts/build-whisper-runtime.sh
          scripts/build-whisper-runtime.sh darwin arm64

      - name: Build Go engine (macOS arm64)
        env:
          GOARCH: arm64
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
          BRANCH=$(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo "unknown")
          HASH=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")
          TIME=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          go build -trimpath -ldflags "-X main.buildVersion=$VERSION -X main.gitBranch=$BRANCH -X main.gitHash=$HASH -X main.buildTime=$TIME -X main.release=true -s -w" -o build/darwin_arm64/vdub .

      - name: Build Flutter UI (macOS)
        working-directory: ui
        run: |
          flutter pub get
          flutter build macos --release --split-debug-info=../build/debug-info --obfuscate

      - name: Assemble .app and create DMG
        run: |
          APP="ui/build/macos/Build/Products/Release/vdub_ui.app"
          install -m 755 build/darwin_arm64/vdub "$APP/Contents/Resources/vdub"
          install -m 755 vendor/ffmpeg/darwin/ffmpeg "$APP/Contents/Resources/ffmpeg"
          cp -R vendor/whisper/darwin "$APP/Contents/Resources/whisper"
          codesign --force --deep --sign - "$APP"
          TAG="${{ github.event.release.tag_name }}"
          hdiutil create -volname "VDub" -srcfolder "$APP" -ov -format ULMO "vdub-macos-arm64-$TAG.dmg"
          tar -czf "vdub-whisper-darwin-arm64.tar.gz" -C vendor/whisper/darwin .

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            vdub-macos-arm64-*.dmg
            vdub-whisper-darwin-arm64.tar.gz

  build-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goarch: amd64
            ffmpeg_url_env: FFMPEG_LINUX_AMD64_URL
            cc: gcc
            cxx: g++
            cross_pkgs: ''
          - goarch: arm64
            ffmpeg_url_env: FFMPEG_LINUX_ARM64_URL
            cc: aarch64-linux-gnu-gcc
            cxx: aarch64-linux-gnu-g++
            cross_pkgs: gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config \
            libgtk-3-dev libblkid-dev liblzma-dev \
            ${{ matrix.cross_pkgs }}

      - name: Download ffmpeg (Linux ${{ matrix.goarch }})
        run: |
          mkdir -p vendor/ffmpeg/linux
          curl -fSL "${{ env[matrix.ffmpeg_url_env] }}" | gunzip > vendor/ffmpeg/linux/ffmpeg
          chmod +x vendor/ffmpeg/linux/ffmpeg

      - name: Build whisper.cpp runtime (Linux ${{ matrix.goarch }})
        run: |
          chmod +x scripts/build-whisper-runtime.sh
          scripts/build-whisper-runtime.sh linux ${{ matrix.goarch }}

      - name: Build Go engine (Linux ${{ matrix.goarch }})
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
          BRANCH=$(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo "unknown")
          HASH=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")
          TIME=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          go build -trimpath -ldflags "-X main.buildVersion=$VERSION -X main.gitBranch=$BRANCH -X main.gitHash=$HASH -X main.buildTime=$TIME -X main.release=true -s -w" -o build/linux_${{ matrix.goarch }}/vdub .

      - name: Compress Go binary with UPX
        if: matrix.goarch == 'amd64'
        run: |
          sudo apt-get install -y upx-ucl || true
          upx --best --lzma build/linux_${{ matrix.goarch }}/vdub || true

      - name: Build Flutter UI (Linux)
        if: matrix.goarch == 'amd64'
        working-directory: ui
        run: |
          flutter pub get
          flutter build linux --release --split-debug-info=../build/debug-info --obfuscate

      - name: Assemble release package (amd64 full)
        if: matrix.goarch == 'amd64'
        run: |
          RELEASE_DIR="ui/build/linux/x64/release/bundle"
          cp build/linux_amd64/vdub "$RELEASE_DIR/vdub"
          cp vendor/ffmpeg/linux/ffmpeg "$RELEASE_DIR/ffmpeg"
          cp -R vendor/whisper/linux "$RELEASE_DIR/whisper"
          chmod +x "$RELEASE_DIR/vdub" "$RELEASE_DIR/ffmpeg"
          TAG="${{ github.event.release.tag_name }}"
          tar -czf "vdub-linux-amd64-$TAG.tar.gz" -C "$RELEASE_DIR" .
          tar -czf "vdub-whisper-linux-amd64.tar.gz" -C vendor/whisper/linux .

      - name: Assemble release package (arm64 headless)
        if: matrix.goarch == 'arm64'
        run: |
          TAG="${{ github.event.release.tag_name }}"
          mkdir -p dist
          cp build/linux_arm64/vdub dist/
          cp vendor/ffmpeg/linux/ffmpeg dist/
          cp -R vendor/whisper/linux dist/whisper
          chmod +x dist/vdub dist/ffmpeg
          tar -czf "vdub-linux-arm64-$TAG.tar.gz" -C dist .
          tar -czf "vdub-whisper-linux-arm64.tar.gz" -C vendor/whisper/linux .

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            vdub-linux-${{ matrix.goarch }}-*.tar.gz
            vdub-whisper-linux-${{ matrix.goarch }}.tar.gz
