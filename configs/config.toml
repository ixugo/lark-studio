[Server]
  [Server.HTTP]
    Port = 9523
    JwtSecret = ""
    Timeout = "120s"

    [Server.HTTP.Pprof]
      Enabled = true
      AccessIps = ['::1', '127.0.0.1']

[Data]
  [Data.Database]
    # 相对路径基于 DataDir，DataDir 默认 ~/dsub
    Dsn = 'vdub.db'
    MaxIdleConns = 1
    MaxOpenConns = 1
    ConnMaxLifetime = '6h0m0s'
    SlowThreshold = '200ms'

[Log]
  Dir = './logs'
  Level = 'debug'
  MaxAge = 7
  RotationTime = '8h0m0s'
  MaxSize = 50
  Compress = false
  MaxBackups = 0

# 流水线配置
[Pipeline]
  # 并行 worker 数量
  Workers = 2
  # whisper 模式: whisper-cpp / ffmpeg（ffmpeg 需编译时启用 --enable-whisper）
  WhisperMode = "ffmpeg"
  # whisper.cpp 可执行文件路径（WhisperMode=whisper-cpp 时生效）
  WhisperBin = "whisper-cpp"
  # whisper ggml 模型文件路径
  WhisperModel = ""
  # ffmpeg 路径（空则使用 PATH 中的）
  FFmpegBin = ""
  # 默认输出目录（空则与输入同目录加 _final 后缀）
  DefaultOutputDir = ""
  # 默认目标语言
  DefaultTargetLang = "zh-CN"

# LLM 翻译配置
[LLM]
  BaseURL = "http://localhost:11434/v1"
  APIKey = ""
  Model = "qwen2.5:7b"

# TTS 配置
[TTS]
  # 类型: edge / openai
  Type = "edge"
  Voice = "zh-CN-YunjianNeural"
  # OpenAI TTS 配置（Type=openai 时生效）
  BaseURL = ""
  APIKey = ""
  Model = "tts-1"
