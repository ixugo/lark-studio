[Server]
  [Server.HTTP]
    Port = 9523
    JwtSecret = ""
    Timeout = "120s"

    [Server.HTTP.Pprof]
      Enabled = true
      AccessIps = ['::1', '127.0.0.1']

[Data]
  [Data.Database]
    # 相对路径基于 DataDir，DataDir 默认 ~/dsub
    Dsn = 'vdub.db'
    MaxIdleConns = 1
    MaxOpenConns = 1
    ConnMaxLifetime = '6h0m0s'
    SlowThreshold = '200ms'

[Log]
  Dir = './logs'
  Level = 'debug'
  MaxAge = 7
  RotationTime = '8h0m0s'
  MaxSize = 50
  Compress = false
  MaxBackups = 0

# 流水线配置
[Pipeline]
  # 并发任务数（1~8，默认 2，保存后即时生效）
  Workers = 2
  # ASR 引擎: whisper-cpp / openai
  WhisperMode = "whisper-cpp"
  # whisper.cpp 可执行文件路径（留空优先使用应用内嵌运行时）
  WhisperBin = "whisper-cli"
  # whisper ggml 模型文件路径
  WhisperModel = ""
  # OpenAI 兼容 ASR API 配置
  ASRBaseURL = "https://api.openai.com/v1"
  ASRAPIKey = ""
  ASRModel = "whisper-1"
  # ffmpeg 路径（空则使用 PATH 中的）
  FFmpegBin = ""
  # 默认输出目录（空则与输入同目录加 _final 后缀）
  DefaultOutputDir = ""
  # 默认目标语言
  DefaultTargetLang = "zh-CN"
  # 自定义翻译系统提示词（留空使用内置默认模板，可用变量: {{target_lang}} {{count}}）
  TranslatePrompt = ""
  # TTS 调速上限（0 或 ≤1 不调速，推荐 1.2~1.3）
  MaxSpeedFactor = 1.2
  # 每次发给 LLM 的句子数（5~20，默认 10）
  TranslateChunkSize = 10
  # TTS 并发协程数（1~4，默认 2）
  TTSWorkers = 2
  # 字幕输出方式: soft (软字幕，流复制秒级完成，推荐) / burn (硬字幕烧录画面) / none (无字幕)
  SubtitleOutput = "soft"
  # 处理完成后删除中间产物（raw.mp3/audio_segs 等）
  CleanIntermediate = false

# LLM 翻译配置
[LLM]
  # 翻译供应商: google (免Key推荐) / bing / openai / deeplx
  Provider = "google"
  BaseURL = "http://localhost:11434/v1"
  APIKey = ""
  Model = "qwen2.5:7b"

# TTS 配置
[TTS]
  # 类型: edge / openai
  Type = "edge"
  Voice = "zh-CN-YunjianNeural"
  # OpenAI TTS 配置（Type=openai 时生效）
  BaseURL = ""
  APIKey = ""
  Model = "tts-1"
